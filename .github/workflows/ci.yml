name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/run-tests.ps1

      - name: Render the widget tile (smoke test)
        shell: powershell
        run: |
          $env:CLW_HOME = Join-Path $env:RUNNER_TEMP 'clw'
          powershell -NoProfile -ExecutionPolicy Bypass -File src/ClaudeLockWidget.ps1 preview -Demo -NoOpen -Out "$env:RUNNER_TEMP\demo.png"
          if (-not (Test-Path "$env:RUNNER_TEMP\demo.png")) { throw 'preview was not written' }

      - name: Upload demo tile
        uses: actions/upload-artifact@v4
        with:
          name: demo-tile
          path: ${{ runner.temp }}/demo.png

  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and sign the widget package (ephemeral certificate)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File widget/Build-Widget.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: widget-package
          path: |
            widget/dist/ClaudeLockWidget.msix
            widget/dist/ClaudeLockWidget.cer

  # Advisory static analysis: prints findings and a summary but never fails the build.
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer (advisory)
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $exclude = 'PSAvoidUsingWriteHost', 'PSUseShouldProcessForStateChangingFunctions', 'PSUseSingularNouns'
          # -Path accepts a single path, so analyse each folder on its own
          $findings = @('src', 'widget') | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_ -Recurse -Severity Error, Warning -ExcludeRule $exclude
          }
          $findings | Sort-Object Severity, ScriptName, Line |
            Format-Table Severity, RuleName, ScriptName, Line, Message -AutoSize | Out-String -Width 250 | Write-Host
          $errors = @($findings | Where-Object Severity -eq 'Error')
          $warnings = @($findings).Count - $errors.Count
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "PSScriptAnalyzer: $($errors.Count) error(s), $warnings warning(s) (advisory)"
          foreach ($e in $errors) { Write-Host "::warning::PSScriptAnalyzer error $($e.RuleName) in $($e.ScriptName):$($e.Line) - $($e.Message)" }
          exit 0
